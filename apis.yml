aid: nexus-ai
name: Nexus AI
description: Surfaced in the API Evangelist network as "Nexus AI", a 500 Global portfolio
  lead, but its recorded domain conceptdrop.com now permanently redirects (301) to
  hiresource.io — the site of Source (formerly ConceptDrop), a freelance creative-talent
  management platform. Source lets teams find, vet, and manage freelance designers,
  writers, animators, and consultants through a single contract with a dedicated account
  manager, replacing traditional creative-agency procurement. The customer application
  lives at app.hiresource.io; the public site is a WordPress marketing property. During
  enrichment no public developer API, developer portal, OpenAPI/AsyncAPI spec, MCP server,
  or /.well-known discovery surface was found — this remains a non-API company profile.
